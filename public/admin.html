<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Applications | Áille admin</title>
  <meta name="description" content="Log in or apply for an Áille Health Clinic trade account." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/"><img src="/img/logo.webp" alt="" /><span>Áille<small>Health Clinic</small></span></a>
      <nav class="nav-links" aria-label="Main">
        <a href="/range.html">Our range</a>
        <a href="/#practitioners">Trade accounts</a>
        <a href="/#resources">Resources</a>
        <a href="/#contact">Contact</a>
      </nav>
      <div class="nav-cta">
        <span id="navAccount" class="nav-cta"></span>
        <button class="menu-btn" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap" style="padding:36px 0 72px">
      <p class="kicker">Admin</p>
      <h1 style="font-size:clamp(1.8rem,3vw,2.4rem);margin-bottom:18px">Practitioner applications</h1>
      <div class="toolbar">
        <div class="tabs" id="filters" style="margin:0;flex:1;max-width:520px">
          <button data-f="pending" class="on">Pending</button><button data-f="approved">Approved</button><button data-f="rejected">Rejected</button><button data-f="all">All</button>
        </div>
        <label class="search" style="max-width:320px"><span class="sr-only">Search</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search name, clinic, email" /></label>
      </div>
      <p class="hint" style="margin-bottom:16px">Orders and payments are in your <a href="https://dashboard.stripe.com/payments" target="_blank" rel="noopener">Stripe dashboard</a>.</p>
      <div id="list" class="admin-grid"><div class="empty">Loading…</div></div>
    </div>
  </main>
  <footer class="footer">
    <div class="wrap">
      <span>© 2026 Áille Health Clinic · Wexford, Ireland</span>
      <span><a href="/range.html">Range</a> · <a href="/account.html">Practitioner login</a> · <a href="mailto:info@aillehealth.ie">info@aillehealth.ie</a></span>
    </div>
  </footer>
  <script type="module" src="/js/admin.js"></script>
  <script type="module" src="/js/util.js"></script>
</body>
</html>
